<form [formGroup]="registerForm" (ngSubmit)="onSubmit(registerForm)" class="space-y-4">
  <app-user-type-selector [formGroup]="registerForm" />

  
  <p *ngIf="error"  class="p-4 mb-4 text-sm text-red-800 rounded-lg bg-red-50 dark:bg-gray-800 dark:text-red-400">
    
    <!-- *ngIf="error" -->
    {{ error }}
  </p>

  <div class="grid grid-cols-2 gap-4">
    <app-form-field label="First Name" id="firstName" [error]="getFieldError('firstName')">
      <input type="text" id="firstName" formControlName="firstName"
        class="w-full p-2 border rounded focus:ring-2 focus:ring-orange-500">
    </app-form-field>

    <app-form-field label="Last Name" id="lastName" [error]="getFieldError('lastName')">
      <input type="text" id="lastName" formControlName="lastName"
        class="w-full p-2 border rounded focus:ring-2 focus:ring-orange-500">
    </app-form-field>
  </div>

  <app-form-field label="Email" id="email" [error]="getFieldError('email')">
    <input type="email" id="email" formControlName="email"
      class="w-full p-2 border rounded focus:ring-2 focus:ring-orange-500">
  </app-form-field>

  <app-form-field label="Password" id="password" [error]="getFieldError('password')">
    <input type="password" id="password" formControlName="password"
      class="w-full p-2 border rounded focus:ring-2 focus:ring-orange-500 my-5">
  </app-form-field>

  <!-- <div class="flex items-center gap-2">
    <input type="checkbox" id="terms" formControlName="terms" class="h-4 w-4 rounded border-gray-300">
    <label for="terms" class="text-sm text-gray-700">
      I agree to the Terms of Service and Privacy Policy
    </label>
  </div> -->

  <!-- <app-button type="submit" [disabled]="registerForm.invalid">
    Create Account
  </app-button> -->


  
  <app-button type="submit" class="">
    Create Account
  </app-button>
</form>
