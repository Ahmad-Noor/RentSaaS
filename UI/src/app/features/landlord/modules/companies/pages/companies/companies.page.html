<div class="p-4">
    <h1 class="text-2xl font-bold mb-4">Companies</h1>
    <div class="space-y-6">
    <div class="flex justify-between items-center">
     
      <a 
        routerLink="new"
        class="bg-[#0078D4] text-white px-4 py-2 rounded flex items-center gap-2 hover:bg-[#106EBE] transition-colors"
      >
        <span class="material-icons text-sm">add</span>
        Add Company
      </a>
    </div>

    <div class="bg-white rounded-lg shadow">
      <div class="p-6">
        <app-action-bar 
          searchPlaceholder="Search companies" 
          (onSearch)="handleSearch($event)"
        />

        <table class="w-full">
<thead>
  <tr class="border-b">
    <th *ngFor="let column of columns" class="text-left py-3 px-4">
      {{ column.label }}
    </th>
  </tr>
</thead>
<tbody>
  <tr *ngFor="let row of filteredCompanies" class="border-b hover:bg-gray-50">
    <td *ngFor="let column of columns" class="py-3 px-4">
      <ng-container *ngIf="column.key === 'actions'; else defaultContent">
        <div class="flex gap-2">
          <button
            class="text-gray-600 hover:text-blue-600"
            (click)="handleAction({ type: 'edit', item: row })"
          >
            <span class="material-icons">edit</span>
          </button>
          <button
            class="text-gray-600 hover:text-red-600"
            (click)="handleAction({ type: 'delete', item: row })"
          >
            <span class="material-icons">delete</span>
          </button>
        </div>
      </ng-container>

      <ng-template #defaultContent>
        <ng-container *ngIf="column.key !== 'actions'">
          <ng-container *ngIf="column.type === 'status'">
            <span [class]="getStatusClass(row[column.key].toString())">
              {{ row[column.key] }}
            </span>
          </ng-container>
          <ng-container *ngIf="column.type !== 'status'">
            {{ row[column.key] }}
          </ng-container>
        </ng-container>
      </ng-template>
    </td>
  </tr>
</tbody>
</table>


      </div>
    </div>
  </div>
  </div>
