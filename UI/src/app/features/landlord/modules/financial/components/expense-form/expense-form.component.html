
<form [formGroup]="DataForm" (ngSubmit)="handleSubmit()" class="space-y-6">


    <!-- <app-expense-type-selector [formGroup]="DataForm" /> -->
    



 <div  class="space-y-4">
    <!-- Property/General Type Selection -->
    <div class="flex gap-4">
      <label class="flex items-center p-4 border rounded-lg cursor-pointer hover:bg-gray-50"
             [class.border-blue-500]="DataForm.get('type')?.value === 'property'"
             [class.bg-blue-50]="DataForm.get('type')?.value === 'property'">
        <input
          type="radio"
          formControlName="type"
          value="property"
          class="hidden"
        >
        <span class="material-icons text-gray-600 mr-2">apartment</span>
        <span>Property Expense</span>
      </label>

      <label class="flex items-center p-4 border rounded-lg cursor-pointer hover:bg-gray-50"
             [class.border-blue-500]="DataForm.get('type')?.value === 'general'"
             [class.bg-blue-50]="DataForm.get('type')?.value === 'general'">
        <input
          type="radio"
          formControlName="type"
          value="general"
          class="hidden"
        >
        <span class="material-icons text-gray-600 mr-2">account_balance_wallet</span>
        <span>General Expense</span>
      </label>
    </div>

    <!-- Recurring/One-time Selection -->
    <app-form-field label="Payment Schedule" id="expenseType" [error]="getFieldError('expenseType')">
      <select
        id="expenseType"
        formControlName="expenseType"
        class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500">
        <option value="onetime">One-time</option>
        <option value="recurring">Recurring</option>
        <option value="scheduled">Scheduled</option>
      </select>
    </app-form-field>
  </div>
    @if (DataForm.get('type')?.value === 'property') {
      <!-- <app-property-selector [formGroup]="DataForm" /> -->
      <div [formGroup]="DataForm">
        <app-form-field
          label="Property"
          id="propertyId"
          [error]="getFieldError('propertyId')"
        >
          <select id="propertyId" formControlName="propertyId" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500">
            <option value=""  selected>Select property</option>
            <option *ngFor="let property of properties" [value]="property.id">
              {{ property.address }}
            </option>
          </select>
        </app-form-field>
      </div>
    }



    
    <!-- <app-expense-details-form [formGroup]="DataForm" /> -->
    
    <!-- <app-receipt-upload [formGroup]="DataForm" /> -->

    <div class="flex justify-end gap-4">
      <a 
        routerLink=".."
        class="px-4 py-2 text-gray-700 hover:text-gray-900"
      >
        Cancel
      </a>
      <button
        type="submit"
        [disabled]="!DataForm.valid || loading"
        class="px-4 py-2 text-white bg-blue-600 rounded hover:bg-blue-700 disabled:opacity-50"
      >
        {{ loading ? 'Saving...' : 'Save Expense' }}
      </button>
    </div>
  </form>
