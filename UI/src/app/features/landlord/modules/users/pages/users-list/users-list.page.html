<div class="space-y-6">
    <div class="flex justify-between items-center">
      <h1 class="text-2xl font-semibold">Users</h1>
      <a 
        routerLink="add"
        class="bg-[#0078D4] text-white px-4 py-2 rounded flex items-center gap-2 hover:bg-[#106EBE] transition-colors"
      >
        <span class="material-icons text-sm">add</span>
        Add User
      </a>
    </div>

    <div class="flex items-center mb-4">
      <input 
        type="text" 
        class="pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Search users" 
        (input)="handleSearch($event)"
      />
    </div>

    <div class="bg-white rounded-lg shadow">
      <div class="p-6">
        <table class="w-full">
          <thead>
            <tr class="border-b">
              <th *ngFor="let column of columns" class="text-left py-3 px-4">
                {{ column.label }}
              </th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let row of filteredUsers; trackBy: trackByFn" class="border-b hover:bg-gray-50">
              <td *ngFor="let column of columns" class="py-3 px-4">
                <ng-container [ngSwitch]="column.type">
                  <span *ngSwitchCase="'status'" [class]="getStatusClass(row[column.key])">
                    {{ row[column.key] }}
                  </span>
                  <div *ngSwitchCase="'actions'" class="flex gap-2">
                    <button 
                      class="text-gray-600 hover:text-blue-600"
                      (click)="handleEdit(row.id)"
                    >
                      <span class="material-icons">edit</span>
                    </button>
                    <button 
                      class="text-gray-600 hover:text-red-600"
                      (click)="handleDelete(row.id)"
                    >
                      <span class="material-icons">delete</span>
                    </button>
                  </div>
                  <span *ngSwitchDefault>
                    {{ row[column.key] }}
                  </span>
                </ng-container>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
