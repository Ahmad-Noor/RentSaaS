
<div class="bg-white rounded-lg shadow overflow-hidden bg-red-500">
  <div class="relative h-48 bg-gray-200">
    <img 
      [src]="property.address || 'assets/placeholder-property.jpg'"
      [alt]="property.address"
      class="w-full h-full object-cover"
    >
    <button 
      class="absolute top-2 right-2 p-1 rounded-full bg-white/80 hover:bg-white"
      (click)="onFavorite.emit(property)"
    >
      <span class="material-icons text-gray-600">favorite_border</span>
    </button>
  </div>
  
  <div class="p-4">
    <div class="flex justify-between items-start mb-2">
      <h3 class="text-lg font-semibold">{{ property.address }}</h3>
      <!-- <span [class]="getStatusClass()">{{ property.unite }}</span> -->
    </div>
    
    <div class="text-sm text-gray-600 mb-4">
      <p>{{ property.address }}</p>
      <p>{{ property.address }} Units | {{ property.address }} Occupied</p>
    </div>
    
    <div class="flex justify-between items-center">
      <button 
        class="text-blue-600 hover:text-blue-700"
        (click)="onAction.emit({ type: 'edit', property: property })"
      >
        Edit
      </button>
      <app-property-actions 
        [property]="property"
        (onAction)="onAction.emit($event)"
      />
    </div>
  </div>
</div>
