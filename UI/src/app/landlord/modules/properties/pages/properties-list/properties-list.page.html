<div class="space-y-6">
  <div class="flex justify-between items-center">
    <h1 class="text-2xl font-semibold">Properties</h1>
    <div class="flex items-center gap-4">
      <app-view-toggle [currentView]="view" (viewChange)="view = $event" />
      <a routerLink="new"
        class="bg-[#0078D4] text-white px-4 py-2 rounded flex items-center gap-2 hover:bg-[#106EBE] transition-colors">
        <span class="material-icons text-sm">add</span>
        Add Property
      </a>
    </div>
  </div>

  <div class="bg-white rounded-lg shadow">
    <div class="p-6">
      <app-action-bar searchPlaceholder="Search properties" />

      @if (view === 'list') {
      <app-property-table [properties]="properties" (onAction)="handleAction($event)" />
      }








      @else {
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-6">
        @for (property of properties; track property.id) {
        <app-property-card [property]="property" (onAction)="handleAction($event)" />
        }
      </div>
      }
    </div>
  </div>
</div>
