<div class="space-y-6">
    <div class="flex justify-between items-center">
      <h1 class="text-2xl font-semibold">Add New Lease</h1>
      <a routerLink="../" class="text-gray-600 hover:text-gray-900 flex items-center gap-2">
        <span class="material-icons">arrow_back</span>
        Back to Leases
      </a>
    </div>
  
    <div class="bg-white rounded-lg shadow p-6">
      <form [formGroup]="leaseForm" (ngSubmit)="onFormSubmit()" class="space-y-6">
  
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="propertyId" class="block text-sm font-medium text-gray-700">Property</label>
            <select id="propertyId" formControlName="propertyId" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500">
              <option value="" selected>Select property</option>
              <option *ngFor="let property of properties" [value]="property.id">{{ property.address }}</option>
            </select>
          </div>
  
          <!-- <div>
            <label for="leasetype" class="block text-sm font-medium text-gray-700">Lease Type</label>
            <select id="leasetype" formControlName="leasetype" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500">
              <option value="">Select lease type</option>
              <option value="standard">Standard</option>
              <option value="month">Month-to-Month</option>
              <option value="sublease">Sublease</option>
              <option value="renewal">Renewal</option>
            </select>
          </div> -->
        </div>
  
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="tenantName" class="block text-sm font-medium text-gray-700">Tenant Name</label>
            <input type="text" id="tenantName" formControlName="tenantName" placeholder="Enter tenant's full name" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500">
          </div>
  
          <div>
            <label for="rentAmount" class="block text-sm font-medium text-gray-700">Monthly Rent</label>
            <input type="number" id="rentAmount" formControlName="rentAmount" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500" min="1" step="1">
          </div>
        </div>
  
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="startDate" class="block text-sm font-medium text-gray-700">Start Date</label>
            <input type="date" id="startDate" formControlName="startDate" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500">
          </div>
  
          <div>
            <label for="endDate" class="block text-sm font-medium text-gray-700">End Date</label>
            <input type="date" id="endDate" formControlName="endDate" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
  
        <div class="flex justify-end gap-4">
          <a routerLink=".." class="px-4 py-2 text-gray-700 hover:text-gray-900">Cancel</a>
          <button type="submit" [disabled]="!leaseForm.valid || loading" class="px-4 py-2 text-white bg-blue-600 rounded-md hover:bg-blue-700 disabled:opacity-50">
            {{ loading ? 'Saving...' : 'Create Lease' }}
          </button>
        </div>
      </form>
    </div>
  </div>
