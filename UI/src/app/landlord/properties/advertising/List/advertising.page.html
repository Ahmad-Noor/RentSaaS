<div class="space-y-6">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-semibold">Advertisements</h1>
      <p class="mt-1 text-gray-600">Track and manage your property advertisements</p>
    </div>
    <a routerLink="advertising-add-edit"
      class="bg-[#0078D4] text-white px-4 py-2 rounded flex items-center gap-2 hover:bg-[#106EBE] transition-colors">
      <span class="material-icons text-sm">add</span>
      Add Advertisement
    </a>
  </div>

  <div class="bg-white rounded-lg shadow">
    <div class="p-6">
      <input type="text" class="pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Search advertisements" (input)="handleSearch($event)" />

      <table class="w-full mt-6">
        <thead>
          <tr class="border-b">
            <th class="text-left py-3 px-4">Property</th>
  
            <th class="text-left py-3 px-4">Details</th>
     
            <th class="text-left py-3 px-4">Publishing Platforms</th>
            <th class="text-left py-3 px-4">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let ad of filteredAdvertisements" class="border-b hover:bg-gray-50">
            <td class="py-3 px-4">
              {{ getPropertyName(ad.propertyId!) }}
            </td>
        
            <td class="py-3 px-4">
              {{ ad.details || 'No Details' }}
            </td>
          
            <td class="py-3 px-4">
              <div class="flex gap-2">
                <span *ngIf="ad.zillow" class="text-green-600">
                  <span class="material-icons text-sm">check_circle</span> Zillow
                </span>
                <span *ngIf="ad.trulia" class="text-green-600">
                  <span class="material-icons text-sm">check_circle</span> Trulia
                </span>
                <span *ngIf="ad.apartments" class="text-green-600">
                  <span class="material-icons text-sm">check_circle</span> Apartments
                </span>
                <span *ngIf="ad.realtor" class="text-green-600">
                  <span class="material-icons text-sm">check_circle</span> Realtor
                </span>
                <span *ngIf="!ad.zillow && !ad.trulia && !ad.apartments && !ad.realtor" class="text-gray-600">
                  None
                </span>
              </div>
            </td>
            <td class="py-3 px-4">
              <div class="flex gap-2">
                <button class="text-gray-600 hover:text-blue-600" (click)="handleEditAction(ad)">
                  <span class="material-icons text-sm">edit</span>
                </button>
                <button class="p-1 text-gray-600 hover:text-red-600" (click)="handleDeleteAction(ad)">
                  <span class="material-icons text-sm">delete</span>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
