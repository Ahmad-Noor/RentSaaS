<div class="space-y-6">
  <div class="flex justify-between items-center">
    <h1 class="text-2xl font-semibold">Advertising Listings</h1>
  </div>

  <div class="bg-white rounded-lg shadow">
    <div class="p-6">
      <app-action-bar 
        searchPlaceholder="Search listings" 
        (onSearch)="handleSearch($event)"
      />
      <table class="w-full">
        <thead>
          <tr class="border-b">
            <th *ngFor="let column of columns" class="text-left py-3 px-4">
              {{ column.label }}
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of listings" class="border-b hover:bg-gray-50">
            <td *ngFor="let column of columns" class="py-3 px-4">
              <ng-container *ngIf="column.key === 'actions'; else defaultContent">
                <div class="flex gap-2">
                  <button
                    class="text-gray-600 hover:text-blue-600"
                    (click)="handleAction({ type: 'edit', item: row })"
                  >
                    <span class="material-icons">edit</span>
                  </button>
                  <button
                    class="text-gray-600 hover:text-red-600"
                    (click)="handleAction({ type: 'delete', item: row })"
                  >
                    <span class="material-icons">delete</span>
                  </button>
                </div>
              </ng-container>
              
              <ng-template #defaultContent>
                <ng-container *ngIf="column.key !== 'actions'">
                  <ng-container *ngIf="column.type === 'status'">
                    <span [class]="getStatusClass(toStr(row[column.key]))">
                      {{ row[column.key] }}
                    </span>
                  </ng-container>
                  <ng-container *ngIf="column.type !== 'status'">
                    {{ row[column.key] }}
                  </ng-container>
                </ng-container>
              </ng-template>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
