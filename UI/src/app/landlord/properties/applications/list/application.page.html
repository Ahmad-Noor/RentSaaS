<div class="space-y-6">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-semibold">Applications & Leads</h1>
      <p class="mt-1 text-gray-600">Manage and track rental applications</p>
    </div>
    <a routerLink="send"
      class="bg-[#0078D4] text-white px-4 py-2 rounded flex items-center gap-2 hover:bg-[#106EBE] transition-colors">
      <span class="material-icons text-sm">send</span>
      Send Application
    </a>
  </div>

  <div class="bg-white rounded-lg shadow">
    <div class="p-6">
      <div class="flex items-center justify-between mb-6">
        <app-search-bar placeholder="Search applications" (onSearch)="handleSearch($event)" />
        <div class="flex gap-2">
          <button class="p-2 text-gray-600 hover:bg-gray-100 rounded">
            <span class="material-icons">filter_list</span>
          </button>
          <button class="p-2 text-gray-600 hover:bg-gray-100 rounded">
            <span class="material-icons">download</span>
          </button>
        </div>
      </div>

      <table class="w-full">
        <thead>
          <tr class="border-b">
            <th class="text-left py-3 px-4">Applicant Email</th>
            <th class="text-left py-3 px-4">Phone Number</th>
            <th class="text-left py-3 px-4">Message</th>
            <th class="text-left py-3 px-4">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let application of filteredApplications" class="border-b hover:bg-gray-50">
            <td class="py-3 px-4">
              <div> {{application.applicantEmail}}</div>
              <div class="text-sm text-gray-500"></div>
            </td>

            <td class="py-3 px-4">
              <div> {{application.phoneNumber}}</div>
              <div class="text-sm text-gray-500"></div>
            </td>
            <td class="py-3 px-4">
              <div> {{application.message}}</div>
              <div class="text-sm text-gray-500"></div>
            </td>
            <td class="py-3 px-4">
              <div class="flex gap-2">
                <button class="text-gray-600 hover:text-red-600" (click)="handleEditAction(application)">
                  <span class="material-icons text-sm">edit</span>
                </button>
                <button class="p-1 text-gray-600 hover:text-red-600" (click)="handleDeleteAction(application)">
                  <span class="material-icons text-sm">delete</span>
                </button>
              </div>

            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
