<form [formGroup]="applicationForm" (ngSubmit)="onFormSubmit()" class="space-y-6">
    <!-- Property Selector -->
    <div>
      <label for="propertyId" class="block text-sm font-medium text-gray-700">Property</label>
      <select id="propertyId" formControlName="propertyId" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500">
        <option *ngFor="let property of properties" [value]="property.id">
          {{ property.name }}
        </option>
      </select>
      <div *ngIf="applicationForm.get('propertyId')?.invalid && applicationForm.get('propertyId')?.touched" class="text-red-500 text-sm">
        ❌ Property is required.
      </div>
    </div>
  
    <!-- Applicant Email & Phone Number -->
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Applicant Email</label>
        <input
          type="email"
          id="email"
          formControlName="applicantEmail"
          class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500"
          placeholder="tenant@example.com"
          required
        >
        <div *ngIf="applicationForm.get('applicantEmail')?.invalid && applicationForm.get('applicantEmail')?.touched" class="text-red-500 text-sm">
          ❌ Please enter a valid email address.
        </div>
      </div>
  
      <div>
        <label for="phone" class="block text-sm font-medium text-gray-700">Phone Number</label>
        <input
          type="tel"
          id="phone"
          formControlName="phoneNumber"
          class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500"
          placeholder="+1 555-123-4567"
          pattern="^\+?[0-9]{10,15}$"
          required
        >
        <div *ngIf="applicationForm.get('phoneNumber')?.invalid && applicationForm.get('phoneNumber')?.touched" class="text-red-500 text-sm">
          ❌ Please enter a valid phone number (e.g., +15551234567).
        </div>
      </div>
    </div>
  
    <!-- Message -->
    <div>
      <label for="message" class="block text-sm font-medium text-gray-700">Message</label>
      <textarea
        id="message"
        formControlName="message"
        rows="4"
        class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500"
        placeholder="Add a personal message to the applicant..."
      ></textarea>
    </div>
  
    <!-- Checkboxes for Background and Credit Requests -->
    <div class="flex items-center gap-2">
      <input type="checkbox" id="requestBackground" formControlName="requestBackground" class="rounded border-gray-300">
      <label for="requestBackground" class="text-sm text-gray-700">
        Request background check
      </label>
    </div>
  
    <div class="flex items-center gap-2">
      <input type="checkbox" id="requestCredit" formControlName="requestCredit" class="rounded border-gray-300">
      <label for="requestCredit" class="text-sm text-gray-700">
        Request credit report
      </label>
    </div>
  
    <!-- Submit Button -->
    <div class="flex justify-end gap-4">
      <button
        type="submit"
        [disabled]="!applicationForm.valid || loading"
        class="px-4 py-2 text-white bg-blue-600 rounded hover:bg-blue-700 disabled:opacity-50"
      >
        {{ loading ? 'Sending...' : 'Send Application' }}
      </button>
    </div>
  </form>
