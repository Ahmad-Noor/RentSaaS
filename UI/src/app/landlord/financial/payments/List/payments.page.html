<div class="space-y-6">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-semibold">Payments</h1>
        <p class="mt-1 text-gray-600">Track and manage your property payments</p>
      </div>
      <a routerLink="payment"
        class="bg-[#0078D4] text-white px-4 py-2 rounded flex items-center gap-2 hover:bg-[#106EBE] transition-colors">
        <span class="material-icons text-sm">add</span>
        Add Payment
      </a>
    </div>
  
    <div class="bg-white rounded-lg shadow">
      <div class="p-6">
        <!-- Search input -->
        <input type="text" class="pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Search payment" (input)="handleSearch($event)" />
  
        <table class="w-full mt-6">
          <thead>
            <tr class="border-b">
              <th class="text-left py-3 px-4">Date</th>
              <th class="text-left py-3 px-4">Details</th>
              <th class="text-right py-3 px-4">Amount</th>
              <th class="text-left py-3 px-4">Status</th>
              <th class="text-left py-3 px-4">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let payment of filteredpayments" class="border-b hover:bg-gray-50">
              <td class="py-3 px-4">{{ payment.dueDate | date:'mediumDate' }}</td>
              <td class="py-3 px-4">
                {{ payment.details }}
                <span *ngIf="payment.property"
                  class="ml-2 text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full">Recurring</span>
              </td>
              <td class="py-3 px-4 text-right">{{ payment.amount | currency }}</td>
              <td class="py-3 px-4">
                <span [class]="getStatusClass(payment.status)">{{ payment.status }}</span>
              </td>
              <td class="py-3 px-4">
                <div class="flex gap-2">
                  <button class="text-gray-600 hover:text-red-600" (click)="handleEditAction( payment )">
                    <span class="material-icons text-sm">edit</span>
                  </button>
                  <button class="p-1 text-gray-600 hover:text-red-600" (click)="handleDeleteAction( payment )">
                    <span class="material-icons text-sm">delete</span>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
