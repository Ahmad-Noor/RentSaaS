
    <div class="space-y-6">
      <div class="flex justify-between items-center">
        <h1 class="text-2xl font-semibold">Add New Expense</h1>
        <a 
          routerLink="../"
          class="text-gray-600 hover:text-gray-900 flex items-center gap-2"
        >
          <span class="material-icons">arrow_back</span>
          Back to Expenses
        </a>
      </div>

      <div class="bg-white rounded-lg shadow">
        <div class="p-6">
          <!-- <app-expense-form (save)="handleSave($event)" /> -->
  
          <form [formGroup]="expenseForm" (ngSubmit)="onFormSubmit()" class="space-y-6">
            <div class="space-y-4">
              <div class="flex gap-4">
                <label class="flex items-center p-4 border rounded-lg cursor-pointer hover:bg-gray-50"
                  [class.border-blue-500]="expenseForm.get('expenseType')?.value === 'property'"
                  [class.bg-blue-50]="expenseForm.get('expenseType')?.value === 'property'">
                  <input type="radio" formControlName="expenseType" value="property" class="hidden">
                  <span class="material-icons text-gray-600 mr-2">apartment</span>
                  <span>Property Expense</span>
                </label>
          
                <label class="flex items-center p-4 border rounded-lg cursor-pointer hover:bg-gray-50"
                  [class.border-blue-500]="expenseForm.get('expenseType')?.value === 'general'"
                  [class.bg-blue-50]="expenseForm.get('expenseType')?.value === 'general'">
                  <input type="radio" formControlName="expenseType" value="general" class="hidden">
                  <span class="material-icons text-gray-600 mr-2">account_balance_wallet</span>
                  <span>General Expense</span>
                </label>
              </div>
          
          
              <div>
                <label id="paymentSchedule" class="block text-sm font-medium text-gray-700">Payment Schedule</label>
                <select id="paymentSchedule" formControlName="paymentSchedule"
                  class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500">
                  <option value="null">Select Payment Schedule</option>
                  <option value="onetime">One-time</option>
                  <option value="recurring">Recurring</option>
                  <option value="scheduled">Scheduled</option>
                </select>
                <!-- <p *ngIf="getFieldError('paymentSchedule')" class="mt-1 text-sm text-red-600">{{ getFieldError('paymentSchedule')
                  }}</p> -->
              </div>
          
            </div>
          
            @if (expenseForm.get('expenseType')?.value === 'property') {
         
          
              <div>
                <label id="propertyId" class="block text-sm font-medium text-gray-700">{{ "Property" }}</label>
                <select id="propertyId" formControlName="propertyId"
                  class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500">
                  <option value="null" selected>Select property</option>
                  <option *ngFor="let property of properties" [value]="property.id">
                    {{ property.address }}
                  </option>
                </select>
                <!-- <p *ngIf="getFieldError('propertyId')" class="mt-1 text-sm text-red-600">{{ getFieldError('propertyId') }}</p> -->
              </div>
          
          
             
            }
            @else {
           
            }
          
          
            <div class="space-y-4">
          
          
              <div>
                <label id="category" class="block text-sm font-medium text-gray-700">{{ "Category" }}</label>
                <select id="category" formControlName="category"
                  class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500">
                  <option value="null">Select category</option>
                  <option value="maintenance">Maintenance</option>
                  <option value="utilities">Utilities</option>
                  <option value="insurance">Insurance</option>
                  <option value="taxes">Taxes</option>
                  <option value="mortgage">Mortgage</option>
                  <option value="acquisition">Acquisition</option>
                </select>
                <!-- <p *ngIf="getFieldError('category')" class="mt-1 text-sm text-red-600">{{ getFieldError('category') }}</p> -->
              </div>
          
          
              <div class="grid grid-cols-2 gap-4">
           
                <div>
                  <label id="amount" class="block text-sm font-medium text-gray-700">{{ "Amount" }}</label>
                  <input type="number" id="amount" formControlName="amount"
                    class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500" min="100" step="0.01">
                  <!-- <p *ngIf="getFieldError('amount')" class="mt-1 text-sm text-red-600">{{ getFieldError('amount') }}</p> -->
                </div>
          
                <div>
                  <label id="dueDate" class="block text-sm font-medium text-gray-700">{{ "Due Date" }}</label>
                  <input type="date" id="dueDate" formControlName="dueDate"
                    class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500">
                  <!-- <p *ngIf="getFieldError('dueDate')" class="mt-1 text-sm text-red-600">{{ getFieldError('dueDate') }}</p> -->
                </div>
          
                <div>
                  <label id="details" class="block text-sm font-medium text-gray-700">{{ "Details" }}</label>
                  <textarea id="details" formControlName="details" rows="3"
                    class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500"
                    placeholder="Add any additional details..."></textarea>
                  <!-- <p *ngIf="getFieldError('details')" class="mt-1 text-sm text-red-600">{{ getFieldError('details') }}</p> -->
                </div>
          
                <div class="flex items-center gap-2">
                  <input type="checkbox" id="isPaid" formControlName="isPaid"
                    class="h-4 w-4 rounded border-gray-300 text-blue-600">
                  <label for="isPaid" class="text-sm text-gray-700">
                    Mark as paid
                  </label>
                </div>
              </div>
          
              <div class="space-y-4">
                <div class="flex items-center gap-2">
                  <button type="button" (click)="fileInput.click()"
                    class="flex items-center gap-2 px-4 py-2 text-blue-600 bg-blue-50 rounded-lg hover:bg-blue-100">
                    <span class="material-icons">upload_file</span>
                    Upload Receipts
                  </button>
                  <span class="text-sm text-gray-500">Upload up to 5 receipts (PDF or images)</span>
                </div>
          
                <input #fileInput type="file" (change)="onFilesSelected($event)" accept="image/*,.pdf" class="hidden" multiple>
          
                @if (error) {
                <p class="text-sm text-red-600">{{ error }}</p>
                }
          
                @if (receipts.length > 0) {
                <div class="space-y-2">
                  @for (receipt of receipts; track receipt.id) {
                  <app-receipt-item [receipt]="receipt" (remove)="removeReceipt($event)" />
                  }
                </div>
                }
              </div>
          
              <div class="flex justify-end gap-4">
                <a routerLink=".." class="px-4 py-2 text-gray-700 hover:text-gray-900">
                  Cancel
                </a>
                <button type="submit" [disabled]="!expenseForm.valid || loading"
                  class="px-4 py-2 text-white bg-blue-600 rounded hover:bg-blue-700 disabled:opacity-50">
                  {{ loading ? 'Saving...' : 'Save Expense' }}
                </button>
              </div>
            </div>
          </form>
          
        </div>
      </div>
    </div>
