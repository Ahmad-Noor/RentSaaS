<div class="space-y-6">
    <div class="flex justify-between items-center">
      <h1 class="text-2xl font-semibold">{{ isEditMode ? 'Edit' : 'Add New' }} Company</h1>
      <a 
        routerLink=".."
        class="text-gray-600 px-4 py-2 rounded flex items-center gap-2 hover:bg-gray-100 transition-colors"
      >
        <span class="material-icons text-sm">arrow_back</span>
        Back to List
      </a>
    </div>
    
    <div class="bg-white rounded-lg shadow">
     
      <form [formGroup]="companyForm" (ngSubmit)="onSubmit(companyForm)"  class="p-6 space-y-6">
        <div class="grid grid-cols-1 gap-6">
          <!-- Company Name -->

          <div class="space-y-2">
            <label for="name" class="block text-sm font-medium text-gray-700">Company Name</label>
            <input type="text" id="name" formControlName="name"
              class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          </div>


          <div class="space-y-2">
            <label for="type" class="block text-sm font-medium text-gray-700">Company Type</label>
            <select formControlName="type" id="type"
              class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
              <option  value="null" selected>Select company type</option>
              <option value="ServiceBased">Service-Based</option>
              <option value="ProductBased">Product-Based</option>
              <option value="Hybrid">Hybrid</option>
            </select>
          </div>
          




          <div class="space-y-2">
            <label for="ein" class="block text-sm font-medium text-gray-700">ein</label>
            <input type="number" formControlName="ein"
              class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          </div>








        <!-- Form Actions -->
        <div class="flex justify-end gap-4">
          <button type="button" routerLink=".." class="px-4 py-2 border rounded hover:bg-gray-50">
            Cancel
          </button>
          <button type="submit" [disabled]="!companyForm.valid || loading"
            class="px-4 py-2 bg-[#0078D4] text-white rounded hover:bg-[#c93d0a] bg-orange-500">
            {{ loading ? 'Saving...' : 'Save Company' }}
          </button>
        </div>
        </div>

      </form>
    </div>
  </div>
